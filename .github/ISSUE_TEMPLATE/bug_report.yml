name: Bug report
description: Report reproducible AIBoarding behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction and expected behavior }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Agent, version, and relevant logs }
  - type: markdown
    attributes: { value: "Do not report vulnerabilities here; see SECURITY.md." }
