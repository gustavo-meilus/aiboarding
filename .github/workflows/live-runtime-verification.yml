name: Live Runtime Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: live-runtime-verification
  cancel-in-progress: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Codex lifecycle boundary canary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tests/live/verify_runtime.py --live --strict --runtime codex --case positive --collect-hooks --install-plugin --timeout 60 --evidence-dir live-evidence
      - if: always()
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v3.1.3
        with:
          name: codex-live-evidence
          path: live-evidence
