<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AIBoarding lifecycle example</title><desc id="desc">A fixture-derived example: canonical AGENTS.md, a thin CLAUDE.md import, and state kept outside instructions.</desc>
  <rect width="1200" height="620" rx="28" fill="#101828"/><text x="55" y="80" fill="#f8fafc" font-family="monospace" font-size="34" font-weight="700">AIBoarding keeps the source of truth small</text>
  <rect x="55" y="125" width="500" height="420" rx="18" fill="#182230" stroke="#14b8a6" stroke-width="3"/><text x="90" y="185" fill="#5eead4" font-family="monospace" font-size="30">AGENTS.md</text><text x="90" y="245" fill="#f8fafc" font-family="monospace" font-size="25">## Project Purpose</text><text x="90" y="290" fill="#cbd5e1" font-family="monospace" font-size="23">Invoicing for freelancers.</text><text x="90" y="350" fill="#f8fafc" font-family="monospace" font-size="25">## Build, Test, Run</text><text x="90" y="395" fill="#cbd5e1" font-family="monospace" font-size="23">Build: npm run build.</text><text x="90" y="440" fill="#cbd5e1" font-family="monospace" font-size="23">Test: npm test.</text>
  <path d="M585 275h90" stroke="#14b8a6" stroke-width="12" stroke-linecap="round"/><path d="m650 245 35 30-35 30" fill="none" stroke="#14b8a6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="710" y="125" width="435" height="190" rx="18" fill="#182230" stroke="#2563eb" stroke-width="3"/><text x="750" y="185" fill="#93c5fd" font-family="monospace" font-size="30">CLAUDE.md</text><text x="750" y="245" fill="#f8fafc" font-family="monospace" font-size="28">@AGENTS.md</text>
  <rect x="710" y="355" width="435" height="190" rx="18" fill="#182230" stroke="#475467" stroke-width="3"/><text x="750" y="415" fill="#cbd5e1" font-family="monospace" font-size="30">.aiboarding/state.json</text><text x="750" y="475" fill="#94a3b8" font-family="monospace" font-size="24">sync pointer outside</text><text x="750" y="510" fill="#94a3b8" font-family="monospace" font-size="24">instruction files</text>
</svg>
